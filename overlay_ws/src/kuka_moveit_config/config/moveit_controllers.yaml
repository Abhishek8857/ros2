# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - kuka_arm_controller
    # - plug_1_controller
    # - plug_2_controller
    - omnibase_controller
    - agv_controller

  kuka_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    action_ns: follow_joint_trajectory
    default: true
  # plug_1_controller:
  #   type: GripperCommand
  #   joints:
  #     - endeffector_plug_joint_1
  #   action_ns: gripper_cmd
  #   default: true
  # plug_2_controller:
  #   type: GripperCommand
  #   joints:
  #     - endeffector_plug_joint_2
  #   action_ns: gripper_cmd
  #   default: true
  omnibase_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - omnibase_pris_x_joint
      - omnibase_pris_y_joint
      - omnibase_rev_joint
    action_ns: follow_joint_trajectory
    default: true
  agv_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - agv_pris_x_joint
      - agv_pris_y_joint
      - agv_rev_joint
    action_ns: follow_joint_trajectory
    default: true